name: grow the culture
on:
  schedule:
    - cron: "17 3 * * *"   # every day, 08:47 IST: contributions, latest repo, sky
    - cron: "7 * * * *"    # every hour: delhi time of day + weather for the pond
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/config.json", "scripts/**", "art/**"]
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q fonttools uharfbuzz pillow
      - run: python scripts/lab.py grow
        env:
          GITHUB_TOKEN: ${{ secrets.LAB_TOKEN || secrets.GITHUB_TOKEN }}
          SKY_ONLY: ${{ github.event.schedule == '7 * * * *' && '1' || '' }}
      - name: commit the new plate
        run: |
          git config user.name "lab-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🎏 the pond changed"
          git pull --rebase && git push
