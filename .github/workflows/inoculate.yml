name: inoculate
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: lab
  cancel-in-progress: false
jobs:
  inoculate:
    if: contains(github.event.issue.title, 'inoculate:') || contains(github.event.issue.title, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q fonttools uharfbuzz pillow
      - id: lab
        run: python scripts/lab.py inoculate
        env:
          # passed as env vars, never pasted into the script, so a crafted title can't run code
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
      - name: commit the colony
        run: |
          git config user.name "lab-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🧫 @${{ github.event.issue.user.login }} inoculated the plate"
          git pull --rebase && git push
      - name: reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY: ${{ steps.lab.outputs.reply }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$REPLY"
          gh issue close "$N" --repo "$GITHUB_REPOSITORY"
